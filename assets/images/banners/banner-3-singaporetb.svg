<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 116" width="737" height="116">
  <defs>
    <linearGradient id="sg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="45%" stop-color="#3d0c4e"/>
      <stop offset="100%" stop-color="#7a0d4b"/>
    </linearGradient>
    <linearGradient id="sg-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef233c"/>
      <stop offset="100%" stop-color="#ff0054"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="737" height="116" fill="url(#sg-bg)"/>

  <!-- Modern architectural grid accents -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <circle cx="100" cy="58" r="80" fill="none"/>
    <circle cx="100" cy="58" r="50" fill="none"/>
    <path d="M 640 -20 L 760 140 M 610 -20 L 730 140"/>
  </g>

  <!-- Left: Brand Emblem -->
  <g transform="translate(32, 24)">
    <rect x="0" y="4" width="38" height="38" rx="8" fill="#ef233c"/>
    <text x="19" y="29" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="20" font-weight="900" text-anchor="middle">SG</text>

    <text x="48" y="20" fill="#ffffff" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">Singapore</text>
    <text x="48" y="36" fill="#fca5a5" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-transform="uppercase" letter-spacing="0.14em">Passion Made Possible</text>
  </g>

  <!-- Middle: Message -->
  <g transform="translate(250, 26)">
    <text x="0" y="19" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700">Extraordinary MICE &amp; Leisure Hub</text>
    <text x="0" y="42" fill="#e2e8f0" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">Discover incentive travel schemes, sustainability tours &amp; premium venues</text>
    <text x="0" y="60" fill="#fecdd3" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">✦ In Singapore (INSPIRE) Rewards Scheme for Corporates</text>
  </g>

  <!-- Right: Call to Action Button -->
  <g transform="translate(585, 41)">
    <rect width="124" height="34" rx="17" fill="url(#sg-btn)"/>
    <text x="62" y="21" fill="#ffffff" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.02em">Plan with STB →</text>
  </g>
</svg>
