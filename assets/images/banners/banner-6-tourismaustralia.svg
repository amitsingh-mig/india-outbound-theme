<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 116" width="737" height="116">
  <defs>
    <linearGradient id="au-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="au-sun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="au-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="737" height="116" fill="url(#au-bg)"/>

  <!-- Wave and Sun Motif -->
  <g opacity="0.14">
    <circle cx="680" cy="58" r="75" fill="url(#au-sun)"/>
    <path d="M 0 116 Q 180 85 360 116 T 737 116 L 737 116 L 0 116 Z" fill="#ffffff"/>
  </g>

  <!-- Left: Brand Emblem -->
  <g transform="translate(32, 23)">
    <!-- Kangaroo Silhouette Badge -->
    <rect x="0" y="4" width="38" height="38" rx="8" fill="#0369a1"/>
    <path d="M 12 34 C 15 28, 19 24, 25 21 C 28 19, 30 15, 29 13 C 28 11, 25 11, 23 13 M 25 21 L 20 34 M 25 21 L 32 30 L 36 34" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none"/>

    <text x="48" y="21" fill="#ffffff" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">Australia</text>
    <text x="48" y="37" fill="#fde047" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-transform="uppercase" letter-spacing="0.14em">Tourism Australia</text>
  </g>

  <!-- Middle: Message -->
  <g transform="translate(245, 26)">
    <text x="0" y="19" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700">Come and Say G’day to Australia</text>
    <text x="0" y="42" fill="#e0f2fe" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">Pristine coastlines, culinary wonders &amp; signature Australian wildlife encounters</text>
    <text x="0" y="60" fill="#fef08a" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">✦ Aussie Specialist Programme &amp; Trade Marketing Collateral</text>
  </g>

  <!-- Right: Call to Action Button -->
  <g transform="translate(585, 41)">
    <rect width="124" height="34" rx="17" fill="url(#au-btn)"/>
    <text x="62" y="21" fill="#0c4a6e" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.02em">Partner Guide →</text>
  </g>
</svg>
