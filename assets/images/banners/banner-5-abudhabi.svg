<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 116" width="737" height="116">
  <defs>
    <linearGradient id="ad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ad-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ad-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="737" height="116" fill="url(#ad-bg)"/>

  <!-- Arabesque Geometric Accents -->
  <g opacity="0.12" stroke="#fde68a" stroke-width="1" fill="none">
    <circle cx="680" cy="58" r="80"/>
    <circle cx="680" cy="58" r="55"/>
    <path d="M 680 0 L 680 116 M 622 58 L 738 58"/>
    <polygon points="680,18 720,58 680,98 640,58"/>
  </g>

  <!-- Left: Brand Emblem -->
  <g transform="translate(32, 23)">
    <rect x="0" y="4" width="38" height="38" rx="8" fill="#0f766e" stroke="url(#ad-gold)" stroke-width="1"/>
    <!-- Dome icon -->
    <path d="M 12 28 C 12 18, 26 12, 26 12 C 26 12, 40 18, 40 28 Z" fill="url(#ad-gold)" transform="translate(-7, 2)"/>

    <text x="48" y="21" fill="#ffffff" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">Abu Dhabi</text>
    <text x="48" y="37" fill="url(#ad-gold)" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-transform="uppercase" letter-spacing="0.14em">Experience Department</text>
  </g>

  <!-- Middle: Message -->
  <g transform="translate(245, 26)">
    <text x="0" y="19" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700">Find Your Pace in Abu Dhabi</text>
    <text x="0" y="42" fill="#d1fae5" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">Yas Island entertainment, cultural landmarks, pristine beaches &amp; desert escapes</text>
    <text x="0" y="60" fill="url(#ad-gold)" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">✦ Fast-Track Visas, Indian Weddings &amp; MICE Subsidies Available</text>
  </g>

  <!-- Right: Call to Action Button -->
  <g transform="translate(585, 41)">
    <rect width="124" height="34" rx="17" fill="url(#ad-btn)"/>
    <text x="62" y="21" fill="#1e1805" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.02em">Explore Hub →</text>
  </g>
</svg>
